function b(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function t(u){return btoa(String.fromCharCode.apply(null,u))}
async function dec(k,o){var z=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(o.i)},k,b(o.c));
 return new Response(new Blob([z]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
async function abrir(raw){
 var k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
 var html=await dec(k,P);  // falla aqui si la clave es incorrecta
 var js=await fetch('datos/datos_update.js?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()});
 var o=JSON.parse(js.slice(js.indexOf('{'),js.lastIndexOf('}')+1));
 window._datosActualizados=JSON.parse(await dec(k,o));
 document.open();document.write(html);document.close();}
function guardada(){try{return sessionStorage.getItem(S)||localStorage.getItem(S)}catch(_){return null}}
var f=document.getElementById('f'),e=document.getElementById('e'),g=guardada();
function pedir(m){if(window.top!==window){top.location.href=location.href;return}  // beta.html: pedir la clave arriba
 f.hidden=false;if(m)e.textContent=m;document.getElementById('k').focus();}
function intentar(n){abrir(b(g)).catch(function(err){
 if(err&&err.name==='OperationError'){  // clave guardada ya no sirve (cambio de clave): recien ahi se borra
  try{sessionStorage.removeItem(S);localStorage.removeItem(S)}catch(_){}pedir();return}
 if(n<3){setTimeout(function(){intentar(n+1)},1500);return}  // fallo de red/despliegue: NO borrar la clave guardada
 pedir('No se pudo cargar (conexion o actualizacion en curso). Recargue la pagina en un minuto.')})}
if(g)intentar(0);else pedir();
f.onsubmit=async function(ev){ev.preventDefault();var bt=document.getElementById('b');bt.disabled=true;e.textContent='Verificando…';
 try{var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('k').value),'PBKDF2',false,['deriveBits']);
  var raw=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b(P.s),iterations:P.it,hash:'SHA-256'},km,256));
  await abrir(raw);
  try{sessionStorage.setItem(S,t(raw));if(document.getElementById('r').checked)localStorage.setItem(S,t(raw))}catch(_){}
 }catch(_){e.textContent='Clave incorrecta.';bt.disabled=false}};
})();
